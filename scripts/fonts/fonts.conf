<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Points sharp's librsvg backend at the project's own bundled fonts
  (see scripts/fonts/*.ttf) plus the normal Windows system fonts, so
  hero-image-gen.mjs can use Geist Mono / Outfit by name. librsvg does
  NOT support @font-face src embedding (data URIs are silently
  ignored, falling back to a default serif) - this fontconfig-file
  approach is the only one that actually works. See
  hero-image-gen.mjs's own header comment for the do-not-revert note.
-->
<fontconfig>
  <dir>C:/Users/tzisi/Dev/getglobalyields-full/getglobalyields/scripts/fonts</dir>
  <dir>C:/Windows/Fonts</dir>
  <cachedir>C:/Users/tzisi/Dev/getglobalyields-full/getglobalyields/scripts/fonts/.cache</cachedir>
</fontconfig>
