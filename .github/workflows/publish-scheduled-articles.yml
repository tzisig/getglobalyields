name: Publish Scheduled Articles

# Runs daily and publishes any article across the staged-rollout categories
# (taxes, us-investing, best-brokers, options-income, strategies) whose
# scheduled pubDate has arrived, by flipping draft: true -> draft: false and
# pushing to main. Generalizes what was previously taxes-only so the same
# mechanism can carry the site from ~150 to ~300-350 articles by year end,
# with the daily quota controlled entirely by how pubDates were assigned when
# each batch of articles was written - not by this workflow.
#
# case-study is intentionally excluded - it is paced by real events, not a
# content calendar, and stays hand-published.

on:
  schedule:
    # 06:11 UTC daily. The publish script only acts on Sun-Thu scheduled
    # dates, so running every day (including Fri/Sat) is harmless - it just
    # finds nothing due on those days.
    - cron: '11 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish due articles
        id: publish
        run: node scripts/publish-scheduled-articles.mjs

      # Turns any plain-text cross-reference whose target just went live into a
      # real link. Runs only when something was published, and is deliberately
      # conservative - anything it cannot place unambiguously stays queued in
      # relink-when-published.tsv for a human.
      - name: Link newly published cross-references
        id: relink
        if: steps.publish.outputs.published != '0'
        run: node scripts/relink-published.mjs

      - name: Commit and push
        if: steps.publish.outputs.published != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- src/content src/pages src/components relink-when-published.tsv
          git commit -m "chore: publish scheduled articles (${{ steps.publish.outputs.published }}) - ${{ steps.publish.outputs.published_list }}"
          git push

      # check-draft-links.yml listens for this too, but a push made with the
      # default GITHUB_TOKEN (the "Commit and push" step above) does not
      # trigger other workflows' on:push - a deliberate GitHub anti-loop rule,
      # not a bug in that workflow's trigger config. Without this step, an
      # article that links forward to one of today's still-draft neighbors
      # ships live with nothing checking it until someone notices by hand.
      # Run inline instead of relying on the separate workflow to fire.
      - name: Check for links to draft articles
        if: steps.publish.outputs.published != '0'
        run: node scripts/check-draft-links.mjs
